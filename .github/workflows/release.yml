name: Build and release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  windows:
    runs-on: windows-2022
    # Signing runs only for version tags and only when the Azure OIDC secrets exist;
    # otherwise the build stays unsigned and the draft says so (docs/RELEASING.md, Signing).
    # The federated credential is bound to the "release" environment.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci' }}
    env:
      SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        if: env.SIGNING == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure Azure Trusted Signing
        if: env.SIGNING == 'true'
        shell: pwsh
        run: ./tools/trusted-signing.ps1 -Endpoint '${{ vars.TRUSTED_SIGNING_ENDPOINT }}' -Account '${{ vars.TRUSTED_SIGNING_ACCOUNT }}' -Profile '${{ vars.TRUSTED_SIGNING_PROFILE }}'
      - name: Build, check, package and hash
        shell: pwsh
        run: |
          if ($env:SIGNING -eq 'true') { ./tools/release.ps1 -RequireSigning } else { ./tools/release.ps1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Scrunch-release
          path: |
            artifacts/release/*/Scrunch-*.exe
            artifacts/release/*/Scrunch-*.zip
            artifacts/release/*/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Scrunch-test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: ignore
  draft:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Scrunch-release
          path: release-artifacts
      - name: Create draft release for native acceptance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $files = Get-ChildItem release-artifacts -Recurse -File | Where-Object { $_.Extension -in '.exe','.zip' -or $_.Name -eq 'SHA256SUMS.txt' }
          # CI only proves the headless gate. Native acceptance runs on a real
          # interactive desktop, so the draft says so in its title and notes.
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $banner = 'This draft was produced by CI headless checks only (build, xUnit suite, prepared-asset and shader checks). Native acceptance has not run: do not publish before completing the native gate in docs/RELEASING.md.'
          Set-Content -LiteralPath $notes -Value (@($banner, '') + (Get-Content "docs/releases/$version.md"))
          gh release create $env:RELEASE_TAG @($files.FullName) --verify-tag --draft --title "Scrunch $version (native acceptance pending)" --notes-file $notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
